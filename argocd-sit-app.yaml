apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-sit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/promise-dash/kustomize-gitops-config.git
    targetRevision: main
    path: apps/sample-app/overlays/sit
  destination:
    server: https://kubernetes.default.svc
    namespace: sit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
